[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autodefect-radar"
version = "0.1.0"
description = "Local RAG over public NHTSA recall and complaint data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.1.0",
    "langchain-chroma>=0.2.6",
    "langchain-core>=0.3.76",
    "langchain-huggingface>=1.0.0",
    "langchain-ollama>=1.0.0",
    "langchain-text-splitters>=0.3.11",
    "pydantic>=2.11.0",
    "requests>=2.32.0",
    "sentence-transformers>=5.1.0",
]

[project.scripts]
autodefect-radar = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
